shortDescription:
  en: "Free and open source software for live streaming and screen recording on Windows, Mac, and Linux."
  id: "Perangkat lunak gratis dan sumber terbuka buat live streaming dan rekam layar di Windows, Mac, dan Linux."
description:
  en: "OBS Studio is the free, open source standard for recording and streaming video. You build scenes from windows, webcams, images, browser pages, and capture cards, then record to disk or stream to YouTube, Twitch, or any RTMP service. It includes an audio mixer with filters, a virtual camera, Studio Mode previews, and plugin support. There is no paid tier, no watermark, and no account required."
  id: "OBS Studio itu standar gratis dan sumber terbuka buat merekam dan streaming video. Lo merakit scene dari jendela, webcam, gambar, halaman browser, dan capture card, lalu merekam ke disk atau streaming ke YouTube, Twitch, atau layanan RTMP apa pun. Ia sudah membawa audio mixer dengan filter, kamera virtual, pratinjau Studio Mode, dan dukungan plugin. Tidak ada paket berbayar, tidak ada watermark, dan tidak perlu akun."
features:
  en:
    - "Scenes built from windows, webcams, and browser sources"
    - "Live streaming to YouTube, Twitch, and RTMP services"
    - "Intuitive audio mixer with per-source filters"
    - "Virtual camera for video calls"
    - "Studio Mode and Multiview for live production"
    - "Plugin and script support with Lua and Python"
  id:
    - "Scene yang dirakit dari jendela, webcam, dan sumber browser"
    - "Live streaming ke YouTube, Twitch, dan layanan RTMP"
    - "Audio mixer intuitif dengan filter per sumber"
    - "Kamera virtual buat panggilan video"
    - "Studio Mode dan Multiview buat produksi langsung"
    - "Dukungan plugin dan skrip dengan Lua dan Python"
pricingNote:
  en: "OBS Studio is free forever under the GPL-2.0 license. There is no paid plan, no subscription, and no feature locked behind payment. The project is funded by sponsors and donations."
  id: "OBS Studio gratis selamanya di bawah lisensi GPL 2.0. Tidak ada paket berbayar, tidak ada langganan, dan tidak ada fitur yang dikunci di balik pembayaran. Proyek ini didanai sponsor dan donasi."
