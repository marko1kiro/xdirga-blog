shortDescription:
  en: "Drag and drop design platform for social posts, presentations, videos, and print."
  id: "Platform desain seret dan lepas untuk postingan sosial, presentasi, video, dan cetakan."
description:
  en: "Canva is an online design platform with thousands of templates for social media, presentations, posters, videos, and print. Its editor works in the browser and on desktop and mobile, with AI tools for background removal, resizing, and text to image. The free plan is genuinely usable, while Pro adds premium assets, brand kits, and scheduling."
  id: "Canva adalah platform desain online dengan ribuan template untuk media sosial, presentasi, poster, video, dan cetakan. Editornya jalan di browser, desktop, dan HP, lengkap dengan tool AI untuk hapus latar, ubah ukuran, dan teks jadi gambar. Paket gratisnya beneran kepakai, sementara Pro menambah aset premium, brand kit, dan penjadwalan konten."
features:
  en:
    - "1.6M+ templates on the free plan"
    - "Drag and drop editor in the browser"
    - "Background remover and Magic Resize on Pro"
    - "Brand Kits for consistent visuals"
    - "Social media scheduling"
    - "AI image and video generation"
  id:
    - "1,6 juta lebih template di paket gratis"
    - "Editor seret dan lepas di browser"
    - "Hapus latar dan Magic Resize di paket Pro"
    - "Brand Kit biar visual tetap konsisten"
    - "Penjadwalan konten media sosial"
    - "AI untuk bikin gambar dan video"
pricingNote:
  en: "Free at $0 with 1.6M+ templates, 5 GB storage, and up to 20 AI uses a month. Pro costs $18 a month or $144 a year for one person. Business costs $25 a month or $250 a year per person, and Enterprise is quoted by sales. Prices are US list prices before tax."
  id: "Gratis 0 dolar dengan 1,6 juta lebih template, penyimpanan 5 GB, dan sampai 20 kali pakai AI per bulan. Pro seharga 18 dolar per bulan atau 144 dolar per tahun untuk satu orang. Business seharga 25 dolar per bulan atau 250 dolar per tahun per orang, dan Enterprise ikut harga penawaran. Harga di atas adalah harga resmi Amerika Serikat sebelum pajak."
