shortDescription:
  en: "Microsoft's free, open source code editor with debugging, Git, extensions, and built-in AI agent workflows."
  id: "Editor kode gratis dari Microsoft yang sumber terbuka, lengkap dengan debugging, Git, ekstensi, dan alur kerja agen AI bawaan."
description:
  en: "Visual Studio Code is a lightweight editor that behaves like a full IDE once you add extensions. It ships with IntelliSense, an integrated terminal, debugging, and Git controls, plus a marketplace with thousands of extensions for almost any language or stack. Recent versions add agent harnesses that let you run Copilot, Claude, or Codex agents side by side. It costs nothing and runs on Windows, macOS, and Linux, with a browser version at vscode.dev."
  id: "Visual Studio Code itu editor ringan yang rasanya seperti IDE lengkap begitu lo tambah ekstensi. Ia sudah bawa IntelliSense, terminal terpadu, debugging, dan kontrol Git, plus marketplace berisi ribuan ekstensi buat hampir semua bahasa atau stack. Versi terbaru menambah harness agen yang bikin lo bisa menjalankan agen Copilot, Claude, atau Codex berdampingan. Harganya nol dan jalan di Windows, macOS, dan Linux, dengan versi browser di vscode.dev."
features:
  en:
    - "IntelliSense code completion and smart navigation"
    - "Integrated terminal and task runner"
    - "Built-in Git source control and debugging"
    - "Extension marketplace with thousands of add-ons"
    - "Agent harnesses for Copilot, Claude, and Codex"
    - "Remote development over SSH, containers, and WSL"
  id:
    - "Pelengkapan kode IntelliSense dan navigasi cerdas"
    - "Terminal terpadu dan task runner"
    - "Kontrol sumber Git dan debugging bawaan"
    - "Marketplace ekstensi berisi ribuan tambahan"
    - "Harness agen buat Copilot, Claude, dan Codex"
    - "Pengembangan jarak jauh lewat SSH, container, dan WSL"
pricingNote:
  en: "Visual Studio Code is free to download and use, including for commercial work. There is no paid tier. Some extensions and AI model subscriptions cost extra."
  id: "Visual Studio Code gratis diunduh dan dipakai, termasuk buat kerja komersial. Tidak ada paket berbayar. Sebagian ekstensi dan langganan model AI berbayar terpisah."
