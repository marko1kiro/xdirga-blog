description:
  en: "Gemini is Google's AI assistant on the web and in mobile and desktop apps, with any Google account. It answers questions, writes and summarizes, generates and edits images, runs Deep Research across sources, and connects with Gmail, Docs, and Drive on paid plans. The free plan covers everyday help, while Google AI Pro adds the strongest models, 5 TB of storage, and Gemini inside Google apps."
  id: "Gemini adalah asisten AI Google di web serta aplikasi HP dan desktop, cukup dengan akun Google. Lo bisa tanya jawab, minta tulisan dan ringkasan, bikin dan edit gambar, jalanin Deep Research dari banyak sumber, dan nyambung ke Gmail, Docs, dan Drive di paket berbayar. Paket gratis sudah menutup kebutuhan sehari hari, sementara Google AI Pro menambah model terkuat, penyimpanan 5 TB, dan Gemini di dalam aplikasi Google."
