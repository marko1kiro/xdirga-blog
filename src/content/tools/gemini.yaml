pricingNote:
  en: "Free at $0 with a Google account, including the Flash-Lite model, image generation, Deep Research, Gemini Live, and 15 GB of storage. Google AI Plus costs $4.99 a month, Pro $19.99 a month, and Ultra starts at $99.99 a month. Prices are US list prices before tax."
  id: "Gratis 0 dolar dengan akun Google, termasuk model Flash Lite, bikin gambar, Deep Research, Gemini Live, dan penyimpanan 15 GB. Google AI Plus seharga 4,99 dolar per bulan, Pro 19,99 dolar per bulan, dan Ultra mulai dari 99,99 dolar per bulan. Harga di atas adalah harga resmi Amerika Serikat sebelum pajak."
