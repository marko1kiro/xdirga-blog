shortDescription:
  en: "GitHub's AI coding agent that suggests code, chats about your codebase, and opens pull requests from issues."
  id: "Agen coding AI dari GitHub yang menyarankan kode, menjawab soal codebase lo, dan membuka pull request dari issue."
description:
  en: "GitHub Copilot lives inside your editor, terminal, and GitHub itself. It completes code as you type, explains unfamiliar code in chat, and runs agent sessions that can turn an assigned issue into a pull request. Paid plans add model choice and a monthly allowance of AI credits, while completions stay unlimited. It is the most deeply integrated AI assistant for developers who already live on GitHub."
  id: "GitHub Copilot hidup di dalam editor, terminal, dan GitHub itu sendiri. Ia melengkapi kode saat lo mengetik, menjelaskan kode yang belum lo kenal lewat chat, dan menjalankan sesi agen yang bisa mengubah issue menjadi pull request. Paket berbayar menambah pilihan model dan jatah kredit AI bulanan, sementara pelengkapan kode tetap tanpa batas. Ini asisten AI yang paling menyatu buat developer yang memang sudah tinggal di GitHub."
features:
  en:
    - "Real-time code completions and next-edit suggestions"
    - "Copilot Chat in the editor, terminal, and GitHub.com"
    - "Agent mode that edits files across your workspace"
    - "Cloud agents that pick up assigned issues and open pull requests"
    - "Copilot CLI for terminal workflows"
    - "Pull request reviews with code suggestions"
  id:
    - "Pelengkapan kode seketika dan saran edit berikutnya"
    - "Copilot Chat di editor, terminal, dan GitHub.com"
    - "Mode agen yang mengedit file di seluruh workspace lo"
    - "Agen cloud yang mengambil issue dan membuka pull request"
    - "Copilot CLI untuk kerja lewat terminal"
    - "Review pull request lengkap dengan saran kode"
pricingNote:
  en: "Free costs $0 with 2,000 completions a month. Pro is $10 a month, Pro+ is $39, and Max is $100. Business is $19 per seat a month and Enterprise is $39 per seat a month. Extra AI credit usage is billed at $0.01 per credit."
  id: "Gratis itu $0 dengan 2.000 pelengkapan per bulan. Pro $10 per bulan, Pro+ $39, dan Max $100. Business $19 per kursi per bulan dan Enterprise $39 per kursi per bulan. Pemakaian kredit AI tambahan ditagih $0,01 per kredit."
