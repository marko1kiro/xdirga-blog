shortDescription:
  en: "Free video editor for short form content, with templates, auto captions, and AI tools."
  id: "Editor video gratis untuk konten pendek, lengkap dengan template, caption otomatis, dan tool AI."
description:
  en: "CapCut is a video editor from ByteDance for phones, desktop, and the web, built for short form content on TikTok, Reels, and Shorts. It offers a full timeline, templates, effects, auto captions, and AI tools for video and image generation. The free plan covers basic editing and 1080p export, while Pro adds 4K export, the full AI toolkit, premium templates, and 1 TB of cloud storage."
  id: "CapCut adalah editor video dari ByteDance untuk HP, desktop, dan web, yang dirancang untuk konten pendek di TikTok, Reels, dan Shorts. Di dalamnya ada timeline lengkap, template, efek, caption otomatis, dan tool AI untuk bikin video dan gambar. Paket gratis sudah mencakup edit dasar dan ekspor 1080p, sementara Pro menambah ekspor 4K, tool AI lengkap, template premium, dan penyimpanan cloud 1 TB."
