pricingNote:
  en: "Free at $0 with free templates and basic editing tools. Pro costs $19.99 a month or $179.99 a year, with 1,200 monthly AI credits, 1 TB of storage, and a 7 day free trial for new users. Ultra is $79 a month and Teams is $12.49 per seat a month. Prices are US list prices and vary by region and platform."
  id: "Gratis 0 dolar dengan template gratis dan tool edit dasar. Pro seharga 19,99 dolar per bulan atau 179,99 dolar per tahun, dengan 1.200 kredit AI per bulan, penyimpanan 1 TB, dan uji coba gratis 7 hari buat pengguna baru. Ultra 79 dolar per bulan dan Teams 12,49 dolar per kursi per bulan. Harga di atas adalah harga resmi Amerika Serikat dan bisa berbeda menurut wilayah dan platform."
