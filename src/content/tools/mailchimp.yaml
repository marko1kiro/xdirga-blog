shortDescription:
  en: "Email and SMS marketing with templates, automations, and audience tools for growing businesses."
  id: "Pemasaran email dan SMS dengan template, otomasi, dan perkakas audiens buat bisnis yang sedang tumbuh."
description:
  en: "Mailchimp is the long-running email marketing platform now owned by Intuit. It covers campaign design, audience segmentation, automations, and reporting, with SMS as a paid add-on. Pricing scales with the number of contacts stored, so costs rise as the list grows. The free plan is small at 250 contacts and 500 sends a month, while Standard adds multi-step automation, predictive segments, and A/B testing."
  id: "Mailchimp itu platform pemasaran email yang sudah lama jalan dan kini dimiliki Intuit. Ia mencakup desain kampanye, segmentasi audiens, otomasi, dan laporan, dengan SMS sebagai tambahan berbayar. Harga naik mengikuti jumlah kontak yang disimpan, jadi biaya ikut membesar saat daftar membesar. Paket gratis terbilang kecil dengan 250 kontak dan 500 kiriman per bulan, sementara Standard menambah otomasi banyak langkah, segmen prediktif, dan pengujian A/B."
features:
  en:
    - "Email campaign builder with pre-built templates"
    - "Marketing automation flows up to 200 on Standard"
    - "Predictive segmentation and dynamic content"
    - "A/B and multivariate testing on Premium"
    - "SMS marketing as a paid add-on"
    - "Reports, custom reports, and revenue attribution"
  id:
    - "Pembuat kampanye email dengan template siap pakai"
    - "Alur otomasi pemasaran sampai 200 di paket Standard"
    - "Segmentasi prediktif dan konten dinamis"
    - "Pengujian A/B dan multivariat di paket Premium"
    - "Pemasaran SMS sebagai tambahan berbayar"
    - "Laporan, laporan kustom, dan atribusi pendapatan"
pricingNote:
  en: "Free is $0 for up to 250 contacts and 500 sends a month. Essentials starts at $13 a month for 500 contacts, Standard at $20 a month, and Premium at $350 a month for 10,000 contacts. Standard and Essentials include a 14-day free trial."
  id: "Gratis itu $0 buat sampai 250 kontak dan 500 kiriman per bulan. Essentials mulai $13 per bulan buat 500 kontak, Standard $20 per bulan, dan Premium $350 per bulan buat 10.000 kontak. Standard dan Essentials menyertakan uji coba gratis 14 hari."
