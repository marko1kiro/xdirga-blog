shortDescription:
  en: "Anthropic's AI assistant, known for careful writing, long documents, and coding with Claude Code."
  id: "Asisten AI dari Anthropic, terkenal untuk tulisan yang rapi, dokumen panjang, dan ngoding bareng Claude Code."
description:
  en: "Claude is Anthropic's AI assistant on the web, desktop, and mobile, built for writing, analysis, and coding. It handles long documents, creates artifacts like interactive pages, and runs Claude Code for terminal based development on paid plans. The free plan covers everyday questions, while Pro adds the Opus model, Research, Projects, and Claude Code."
  id: "Claude adalah asisten AI dari Anthropic di web, desktop, dan HP, yang dibuat untuk menulis, analisis, dan ngoding. Lo bisa olah dokumen panjang, bikin artefak seperti halaman interaktif, dan jalanin Claude Code untuk pengembangan lewat terminal di paket berbayar. Paket gratis sudah menutup pertanyaan sehari hari, sementara Pro menambah model Opus, Research, Projects, dan Claude Code."
features:
  en:
    - "Long context for large documents and codebases"
    - "Artifacts for interactive pages and apps"
    - "Claude Code for terminal based development"
    - "Web search, memory, and voice mode"
    - "Projects to organize chats and files"
    - "Research for multi step investigation"
  id:
    - "Konteks panjang untuk dokumen dan codebase besar"
    - "Artefak untuk halaman dan aplikasi interaktif"
    - "Claude Code untuk pengembangan lewat terminal"
    - "Pencarian web, memori, dan mode suara"
    - "Projects untuk merapikan chat dan file"
    - "Research untuk penyelidikan bertahap"
pricingNote:
  en: "Free at $0 with limited usage every 5 hours and every week. Pro costs $20 a month or $17 a month billed yearly at $200 up front. Max costs $100 a month for 5x Pro usage, and Ultra $200 a month for 10x Pro weekly usage. Prices exclude tax."
  id: "Gratis 0 dolar dengan pemakaian terbatas tiap 5 jam dan tiap minggu. Pro seharga 20 dolar per bulan atau 17 dolar per bulan bila ditagih tahunan sebesar 200 dolar di muka. Max seharga 100 dolar per bulan untuk pemakaian 5 kali Pro, dan Ultra 200 dolar per bulan untuk pemakaian mingguan 10 kali Pro. Harga di atas belum termasuk pajak."
