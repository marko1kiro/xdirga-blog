pricingNote:
  en: "Free at $0 on the web, subject to available capacity and limits. Copilot inside Microsoft 365 apps comes with Microsoft 365 Personal at $9.99 a month, Family at $12.99, Premium at $19.99, and Pro at $99.99. For businesses the Copilot add-on is $21 per user a month, and the enterprise add-on is $30. Prices are US list prices and vary by region."
  id: "Gratis 0 dolar di web, tergantung kapasitas dan batas yang tersedia. Copilot di dalam aplikasi Microsoft 365 ikut langganan Microsoft 365 Personal 9,99 dolar per bulan, Family 12,99 dolar, Premium 19,99 dolar, dan Pro 99,99 dolar. Buat bisnis, add on Copilot 21 dolar per pengguna per bulan, dan add on enterprise 30 dolar. Harga di atas adalah harga resmi Amerika Serikat dan bisa berbeda menurut wilayah."
