shortDescription:
  en: "Microsoft's AI assistant, free on the web and built into Word, Excel, PowerPoint, and Outlook with Microsoft 365."
  id: "Asisten AI Microsoft, gratis di web dan menyatu dengan Word, Excel, PowerPoint, dan Outlook lewat Microsoft 365."
description:
  en: "Microsoft Copilot is a free AI assistant on the web and in Windows, macOS, and mobile apps, with chat, web search, image creation, and voice. With an eligible Microsoft 365 subscription it works inside Word, Excel, PowerPoint, and Outlook, drafting documents, analyzing data, and summarizing email. For businesses it is also sold as an add-on that grounds answers in company data."
  id: "Microsoft Copilot adalah asisten AI gratis di web dan aplikasi Windows, macOS, dan HP, dengan chat, pencarian web, bikin gambar, dan suara. Dengan langganan Microsoft 365 yang memenuhi syarat, Copilot bekerja di dalam Word, Excel, PowerPoint, dan Outlook, bikin draf dokumen, menganalisis data, dan meringkas email. Buat bisnis, Copilot juga dijual sebagai add on yang jawabannya berakar pada data perusahaan."
