shortDescription:
  en: "Collaborative design canvas for interfaces, prototypes, and design systems."
  id: "Kanvas desain kolaboratif untuk antarmuka, prototipe, dan design system."
description:
  en: "Figma is a browser based design tool where teams design interfaces, build prototypes, and maintain design systems together in real time. Designers and developers share one file, with comments, variables, components, and Dev Mode for handoff. The free Starter plan covers drafts and learning, while paid seats unlock unlimited files, team libraries, and more AI credits."
  id: "Figma adalah tool desain berbasis browser tempat tim merancang antarmuka, bikin prototipe, dan merawat design system bareng bareng secara langsung. Desainer dan developer berbagi satu file yang sama, lengkap dengan komentar, variabel, komponen, dan Dev Mode untuk serah terima. Paket Starter gratis sudah cukup buat draf dan belajar, sementara kursi berbayar membuka file tanpa batas, pustaka tim, dan kredit AI yang lebih banyak."
features:
  en:
    - "Real time multiplayer editing in the browser"
    - "Interactive prototypes with conditional logic"
    - "Components, variables, and team libraries"
    - "Dev Mode for developer handoff"
    - "FigJam, Slides, and Sites in one workspace"
    - "AI credits for design generation"
  id:
    - "Edit bareng secara langsung di browser"
    - "Prototipe interaktif dengan logika kondisional"
    - "Komponen, variabel, dan pustaka tim"
    - "Dev Mode untuk serah terima ke developer"
    - "FigJam, Slides, dan Sites dalam satu workspace"
    - "Kredit AI untuk bantu bikin desain"
pricingNote:
  en: "Starter is free with unlimited drafts, 3 collaborative files, and 30 day version history. Professional costs $16 a month per full seat billed yearly, with dev seats at $12 and collab seats at $3. Organization is $55 and Enterprise $90 per full seat a month, both billed annually."
  id: "Starter gratis dengan draf tanpa batas, 3 file kolaboratif, dan riwayat versi 30 hari. Professional seharga 16 dolar per bulan per kursi full bila ditagih tahunan, kursi dev 12 dolar dan kursi collab 3 dolar. Organization 55 dolar dan Enterprise 90 dolar per kursi full per bulan, keduanya ditagih tahunan."
