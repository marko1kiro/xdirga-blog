shortDescription:
  en: "No-code automation that connects 9,000+ apps so repetitive work runs itself."
  id: "Otomasi tanpa kode yang menghubungkan lebih dari 9.000 aplikasi supaya kerja berulang jalan sendiri."
description:
  en: "Zapier connects the apps a business already uses and moves data between them with automated workflows called Zaps. Each Zap starts with a trigger and runs actions, and the free plan covers 100 tasks a month with two-step Zaps. Paid plans unlock multi-step Zaps, premium apps, webhooks, and team features. Newer additions include Tables, Forms, MCP, and AI steps that draw from the same task pool."
  id: "Zapier menghubungkan aplikasi yang sudah dipakai sebuah bisnis dan memindahkan data antar aplikasi lewat alur kerja otomatis bernama Zap. Setiap Zap mulai dari trigger lalu menjalankan aksi, dan paket gratis mencakup 100 task per bulan dengan Zap dua langkah. Paket berbayar membuka Zap banyak langkah, aplikasi premium, webhook, dan fitur tim. Tambahan baru mencakup Tables, Forms, MCP, dan langkah AI yang memakai kumpulan task yang sama."
features:
  en:
    - "Automated workflows across 9,000+ apps"
    - "Multi-step Zaps with filters, paths, and formatting"
    - "Built-in Tables for data and Forms for input"
    - "Webhooks and premium app access on paid plans"
    - "AI steps, Copilot, and MCP connections"
    - "Shared workspaces and admin controls on Team plans"
  id:
    - "Alur kerja otomatis di lebih dari 9.000 aplikasi"
    - "Zap banyak langkah dengan filter, jalur, dan format"
    - "Tables bawaan buat data dan Forms buat masukan"
    - "Webhook dan akses aplikasi premium di paket berbayar"
    - "Langkah AI, Copilot, dan koneksi MCP"
    - "Workspace bersama dan kontrol admin di paket Team"
pricingNote:
  en: "Free is $0 for 100 tasks a month. Professional starts at $19.99 a month billed yearly ($29.99 billed monthly) for 750 tasks. Team starts at $69 a month billed yearly for 2,000 tasks and 25 users. Enterprise is custom priced."
  id: "Gratis itu $0 buat 100 task per bulan. Professional mulai $19,99 per bulan bila ditagih tahunan ($29,99 bila bulanan) buat 750 task. Team mulai $69 per bulan bila ditagih tahunan buat 2.000 task dan 25 pengguna. Enterprise harganya menyesuaikan."
