shortDescription:
  en: "Team chat organized into channels, now with Slackbot AI, huddles, and workflow automation built in."
  id: "Chat tim yang rapi dalam channel, kini lengkap dengan AI Slackbot, huddle, dan otomasi alur kerja bawaan."
description:
  en: "Slack replaces scattered email threads with channels where teams talk, share files, and make decisions in the open. Huddles add quick audio and video calls, while Workflow Builder and Lists turn conversations into repeatable processes. Paid plans add unlimited history and AI features, including Slackbot, conversation summaries, and AI search. The free plan is usable for small teams but only keeps 90 days of message history."
  id: "Slack menggantikan utas email yang berceceran dengan channel tempat tim ngobrol, berbagi file, dan mengambil keputusan secara terbuka. Huddle menambah panggilan audio dan video cepat, sementara Workflow Builder dan Lists mengubah percakapan jadi proses yang bisa diulang. Paket berbayar menambah riwayat tanpa batas dan fitur AI, termasuk Slackbot, ringkasan percakapan, dan pencarian AI. Paket gratis masih kepakai buat tim kecil tapi cuma menyimpan riwayat pesan 90 hari."
features:
  en:
    - "Channels, threads, and direct messages"
    - "Huddles for audio and video calls with screen sharing"
    - "Slackbot AI with summaries, search, and answers"
    - "Workflow Builder and Lists for lightweight processes"
    - "Slack Connect for chatting with outside organizations"
    - "Canvases for shared docs inside Slack"
  id:
    - "Channel, thread, dan pesan langsung"
    - "Huddle buat panggilan audio dan video dengan berbagi layar"
    - "AI Slackbot dengan ringkasan, pencarian, dan jawaban"
    - "Workflow Builder dan Lists buat proses ringan"
    - "Slack Connect buat ngobrol dengan organisasi luar"
    - "Canvas buat dokumen bersama di dalam Slack"
pricingNote:
  en: "Free is $0 with 90 days of history and up to 10 apps. Pro is $8.75 per user a month billed monthly, or $7.25 billed annually. Business+ is $18 per user a month billed monthly, or $15 billed annually. Enterprise+ is sold through sales."
  id: "Gratis itu $0 dengan riwayat 90 hari dan maksimal 10 aplikasi. Pro $8,75 per pengguna per bulan bila ditagih bulanan, atau $7,25 bila ditagih tahunan. Business+ $18 per pengguna per bulan bila bulanan, atau $15 bila tahunan. Enterprise+ dijual lewat tim sales."
