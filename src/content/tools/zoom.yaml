description:
  en: "Zoom Workplace is a video conferencing platform for meetings, team chat, whiteboards, and webinars, on the web and in desktop and mobile apps. The free Basic plan covers unlimited 40 minute meetings with up to 100 participants, while paid plans lift the time limit, add cloud recording, AI summaries, and admin controls."
  id: "Zoom Workplace adalah platform konferensi video untuk rapat, chat tim, papan tulis, dan webinar, di web serta aplikasi desktop dan HP. Paket Basic gratis mencakup rapat tanpa batas berdurasi 40 menit dengan sampai 100 peserta, sementara paket berbayar menghapus batas waktu, menambah rekaman cloud, ringkasan AI, dan kontrol admin."
features:
  en:
    - "Unlimited 40 minute meetings on the free plan"
    - "Up to 100 participants on Basic, 300 on Business"
    - "AI meeting summaries and note taking"
    - "Team chat, whiteboard, and scheduling"
    - "Cloud recording on paid plans"
    - "Webinars and large meetings on Enterprise"
  id:
    - "Rapat tanpa batas berdurasi 40 menit di paket gratis"
    - "Sampai 100 peserta di Basic, 300 di Business"
    - "Ringkasan rapat dan pencatatan AI"
    - "Chat tim, papan tulis, dan penjadwalan"
    - "Rekaman cloud di paket berbayar"
    - "Webinar dan rapat besar di Enterprise"
pricingNote:
  en: "Basic is free with 40 minute meetings for up to 100 participants. Pro costs $16.99 per user a month billed monthly or $14.16 billed annually. Business costs $21.99 per user a month billed monthly or $18.33 billed annually, and Enterprise is quoted by sales. Prices are US list prices before tax."
  id: "Basic gratis dengan rapat 40 menit untuk sampai 100 peserta. Pro seharga 16,99 dolar per pengguna per bulan bila ditagih bulanan atau 14,16 dolar bila ditagih tahunan. Business seharga 21,99 dolar per pengguna per bulan bila ditagih bulanan atau 18,33 dolar bila ditagih tahunan, dan Enterprise ikut harga penawaran. Harga di atas adalah harga resmi Amerika Serikat sebelum pajak."
