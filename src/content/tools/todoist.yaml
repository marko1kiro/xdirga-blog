shortDescription:
  en: "A calm, cross-platform to-do list with projects, filters, reminders, and team workspaces."
  id: "Daftar tugas yang tenang dan lintas platform dengan proyek, filter, pengingat, dan workspace tim."
description:
  en: "Todoist is a task manager that works on phone, tablet, watch, desktop, and the web, syncing everything through one account. Tasks support natural language dates, priorities, labels, subtasks, and recurring schedules. Pro adds calendar and table layouts, custom reminders, deadlines, and full history, while Business adds a shared team workspace with roles and centralized billing. The free Beginner plan covers five personal projects."
  id: "Todoist itu manajer tugas yang jalan di HP, tablet, jam, desktop, dan web, menyinkronkan semuanya lewat satu akun. Tugas mendukung tanggal berbahasa natural, prioritas, label, subtugas, dan jadwal berulang. Pro menambah tata letak kalender dan tabel, pengingat kustom, tenggat, dan riwayat lengkap, sementara Business menambah workspace tim bersama dengan peran dan tagihan terpusat. Paket gratis Beginner mencakup lima proyek pribadi."
features:
  en:
    - "Quick Add with natural language due dates"
    - "Projects, labels, filters, and priorities"
    - "Recurring tasks and custom reminders"
    - "Calendar, board, list, and table views"
    - "Team workspace with roles and shared templates"
    - "Todoist Assist and 90+ app integrations"
  id:
    - "Quick Add dengan tanggal jatuh tempo berbahasa natural"
    - "Proyek, label, filter, dan prioritas"
    - "Tugas berulang dan pengingat kustom"
    - "Tampilan kalender, papan, daftar, dan tabel"
    - "Workspace tim dengan peran dan template bersama"
    - "Todoist Assist dan lebih dari 90 integrasi aplikasi"
pricingNote:
  en: "Beginner is free with five personal projects. Pro is $5 a month billed yearly ($60 a year) or $7 a month billed monthly. Business is $8 per user a month billed yearly ($96 a year) or $10 billed monthly, plus local tax."
  id: "Beginner gratis dengan lima proyek pribadi. Pro $5 per bulan bila ditagih tahunan ($60 per tahun) atau $7 per bulan bila bulanan. Business $8 per pengguna per bulan bila ditagih tahunan ($96 per tahun) atau $10 bila bulanan, ditambah pajak lokal."
