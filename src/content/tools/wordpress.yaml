    - "Lebih dari 60.000 plugin di paket berbayar"
    - "Domain kustom dan SSL gratis di paket berbayar"
    - "Pembuat situs AI dan asisten situs"
    - "Toko WooCommerce di paket Commerce"
    - "CDN, firewall, dan perlindungan spam bawaan"
pricingNote:
  en: "Free is $0 with 1 GB of storage. Personal is $4 a month billed yearly ($9 billed monthly), Premium is $8 ($18), Business is $25 ($40), and Commerce is $45 ($70). Longer prepaid terms lower the monthly equivalent further."
  id: "Gratis itu $0 dengan penyimpanan 1 GB. Personal $4 per bulan bila ditagih tahunan ($9 bila bulanan), Premium $8 ($18), Business $25 ($40), dan Commerce $45 ($70). Masa prabayar yang lebih panjang menurunkan tarif bulanan lebih jauh."
