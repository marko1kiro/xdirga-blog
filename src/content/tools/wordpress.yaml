shortDescription:
  en: "Hosted WordPress with themes, plugins, and built-in hosting, from a free blog to a full WooCommerce store."
  id: "WordPress terhosting dengan tema, plugin, dan hosting bawaan, dari blog gratis sampai toko WooCommerce lengkap."
description:
  en: "WordPress.com is the hosted version of WordPress, run by Automattic, so hosting, updates, and security are handled for you. The free plan gives a wordpress.com subdomain with 1 GB of storage and shows ads. Every paid plan now allows plugin installs from more than 60,000 plugins, plus a custom domain and no ads. Business adds developer tools and backups, while Commerce adds a managed WooCommerce store."
  id: "WordPress.com itu versi terhosting dari WordPress yang dijalankan Automattic, jadi hosting, update, dan keamanan sudah diurus buat lo. Paket gratis memberi subdomain wordpress.com dengan penyimpanan 1 GB dan menampilkan iklan. Semua paket berbayar kini boleh memasang plugin dari lebih dari 60.000 plugin, plus domain kustom dan tanpa iklan. Business menambah perkakas developer dan backup, sementara Commerce menambah toko WooCommerce yang dikelola."
features:
  en:
    - "Block editor with themes and drag-and-drop layouts"
    - "More than 60,000 plugins on paid plans"
    - "Custom domain and free SSL on paid plans"
    - "AI website builder and site assistant"
    - "WooCommerce store on the Commerce plan"
    - "Built-in CDN, firewall, and spam protection"
  id:
