shortDescription:
  en: "Payment infrastructure for online and in-person sales, subscriptions, and payouts in 135+ currencies."
  id: "Infrastruktur pembayaran buat penjualan online dan tatap muka, langganan, dan payout dalam lebih dari 135 mata uang."
description:
  en: "Stripe is the payment platform behind millions of online businesses, from solo creators to global enterprises. It accepts cards, digital wallets, bank debits, and local payment methods, with no setup or monthly fees on the standard plan. Billing, invoicing, Terminal, Connect, and Radar extend it into subscriptions, in-person sales, marketplaces, and fraud prevention. Standard pricing is 2.9% plus 30 cents per successful domestic card transaction in the US."
  id: "Stripe itu platform pembayaran di balik jutaan bisnis online, dari kreator solo sampai perusahaan global. Ia menerima kartu, dompet digital, debit bank, dan metode bayar lokal, tanpa biaya setup atau bulanan di paket standar. Billing, invoicing, Terminal, Connect, dan Radar memperluasnya ke langganan, penjualan tatap muka, marketplace, dan pencegahan penipuan. Harga standar 2,9 persen ditambah 30 sen per transaksi kartu domestik yang berhasil di AS."
features:
  en:
    - "Online card, wallet, and local payment acceptance"
    - "Subscriptions and recurring billing"
    - "In-person payments with Terminal readers"
    - "Connect for marketplaces and platforms"
    - "Radar fraud prevention and dispute handling"
    - "Payouts to 160+ countries and financial reporting"
  id:
    - "Penerimaan pembayaran kartu, dompet, dan metode lokal online"
    - "Langganan dan tagihan berulang"
    - "Pembayaran tatap muka dengan reader Terminal"
    - "Connect buat marketplace dan platform"
    - "Pencegahan penipuan Radar dan penanganan sengketa"
    - "Payout ke lebih dari 160 negara dan laporan keuangan"
pricingNote:
  en: "Standard is 2.9% plus 30 cents per successful domestic card transaction in the US, plus 1.5% for international cards and 1% for currency conversion. There are no setup or monthly fees. Volume businesses can negotiate custom pricing."
  id: "Standar itu 2,9 persen ditambah 30 sen per transaksi kartu domestik yang berhasil di AS, ditambah 1,5 persen buat kartu internasional dan 1 persen buat konversi mata uang. Tidak ada biaya setup atau bulanan. Bisnis bervolume besar bisa menegosiasikan harga kustom."
