shortDescription:
  en: "Visual kanban boards for organizing tasks, projects, and team workflows."
  id: "Papan kanban visual untuk merapikan tugas, proyek, dan alur kerja tim."
description:
  en: "Trello is Atlassian's visual task manager built around kanban boards, lists, and cards. Teams drag cards across lists, add due dates, checklists, attachments, and automations, and extend boards with Power-Ups for other apps. The free plan covers up to 10 boards and 10 collaborators, while Premium adds calendar, timeline, and dashboard views plus unlimited automation."
  id: "Trello adalah pengatur tugas visual dari Atlassian yang dibangun di atas papan kanban, daftar, dan kartu. Tim menggeser kartu antar daftar, menambah tenggat, checklist, lampiran, dan otomatisasi, serta memperluas papan dengan Power Up untuk aplikasi lain. Paket gratis mencakup sampai 10 papan dan 10 kolaborator, sementara Premium menambah tampilan kalender, timeline, dan dashboard plus otomatisasi tanpa batas."
features:
  en:
    - "Visual kanban boards, lists, and cards"
    - "Due dates, checklists, and attachments"
    - "Butler no code automation"
    - "200+ Power-Ups and integrations"
    - "Calendar, Timeline, and Dashboard views on Premium"
    - "Mobile and desktop apps with offline boards"
  id:
    - "Papan kanban, daftar, dan kartu yang visual"
    - "Tenggat, checklist, dan lampiran"
    - "Otomatisasi tanpa kode lewat Butler"
    - "200 lebih Power Up dan integrasi"
    - "Tampilan Kalender, Timeline, dan Dashboard di Premium"
    - "Aplikasi HP dan desktop dengan papan offline"
pricingNote:
  en: "Free at $0 for up to 10 collaborators and 10 boards per workspace. Standard costs $5 per user a month billed yearly or $6 billed monthly. Premium costs $10 per user a month billed yearly or $12.50 billed monthly, and Enterprise is $17.50 per user a month billed annually. Prices are US list prices before tax."
  id: "Gratis 0 dolar untuk sampai 10 kolaborator dan 10 papan per workspace. Standard seharga 5 dolar per pengguna per bulan bila ditagih tahunan atau 6 dolar bila ditagih bulanan. Premium seharga 10 dolar per pengguna per bulan bila ditagih tahunan atau 12,50 dolar bila ditagih bulanan, dan Enterprise 17,50 dolar per pengguna per bulan ditagih tahunan. Harga di atas adalah harga resmi Amerika Serikat sebelum pajak."
