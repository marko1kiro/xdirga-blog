description:
  en: "ChatGPT is OpenAI's conversational AI assistant, available on the web and in desktop and mobile apps. It answers questions, drafts text, writes and debugs code, summarizes documents, and creates images. The free plan covers unlimited everyday text chats, while paid plans unlock stronger reasoning models, deeper research, and higher usage limits."
  id: "ChatGPT adalah asisten AI percakapan dari OpenAI yang bisa dipakai di web serta aplikasi desktop dan HP. Lo bisa tanya apa saja, minta draf tulisan, tulis dan debug kode, rangkum dokumen, sampai buat gambar. Paket gratis sudah mencakup chat teks sehari hari tanpa batas, sementara paket berbayar membuka model penalaran yang lebih kuat, riset yang lebih dalam, dan batas pemakaian yang lebih longgar."
