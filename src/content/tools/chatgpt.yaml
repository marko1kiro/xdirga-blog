    - "Agen coding Codex di paket berbayar"
pricingNote:
  en: "Free at $0 with unlimited text chats and limited uploads, images, voice, and deep research. Go costs $8 a month, Plus $20 a month, and Pro starts at $100 a month. Prices are US list prices before tax and vary by region."
  id: "Gratis 0 dolar dengan chat teks tanpa batas plus upload, gambar, suara, dan riset mendalam yang dibatasi. Go seharga 8 dolar per bulan, Plus 20 dolar per bulan, dan Pro mulai dari 100 dolar per bulan. Harga di atas adalah harga resmi Amerika Serikat sebelum pajak dan bisa berbeda di tiap wilayah."
