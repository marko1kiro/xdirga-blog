shortDescription:
  en: "AI writing assistant that fixes grammar, rewrites sentences, and checks tone and plagiarism as you type."
  id: "Asisten menulis AI yang membetulkan grammar, menulis ulang kalimat, dan memeriksa nada serta plagiarisme saat lo mengetik."
description:
  en: "Grammarly checks spelling, grammar, and punctuation in real time across the browser, desktop apps, and mobile keyboard. The free plan includes tone detection and 100 generative AI prompts a month. Pro adds full-sentence rewrites, tone adjustment, fluency help, plagiarism detection, and 2,000 AI prompts a month. Enterprise is now sold through Superhuman Go with admin controls and unlimited prompts."
  id: "Grammarly memeriksa ejaan, grammar, dan tanda baca secara langsung di browser, aplikasi desktop, dan keyboard HP. Paket gratis mencakup deteksi nada dan 100 prompt AI generatif per bulan. Pro menambah tulis ulang kalimat penuh, penyesuaian nada, bantuan kefasihan, deteksi plagiarisme, dan 2.000 prompt AI per bulan. Enterprise kini dijual lewat Superhuman Go dengan kontrol admin dan prompt tanpa batas."
features:
  en:
    - "Real-time grammar, spelling, and punctuation checks"
    - "Tone detection and writing suggestions"
    - "Full-sentence rewrites and fluency improvements"
    - "Plagiarism and AI-generated text detection"
    - "2,000 generative AI prompts a month on Pro"
    - "Style guides, brand tones, and team analytics"
  id:
    - "Pemeriksaan grammar, ejaan, dan tanda baca secara langsung"
    - "Deteksi nada dan saran penulisan"
    - "Tulis ulang kalimat penuh dan perbaikan kefasihan"
    - "Deteksi plagiarisme dan teks hasil AI"
    - "2.000 prompt AI generatif per bulan di Pro"
    - "Panduan gaya, nada merek, dan analitik tim"
pricingNote:
  en: "Free is $0 with 100 AI prompts a month. Pro is $12 per member a month billed annually ($144 a year), $20 a month billed quarterly, or $30 a month billed monthly. Enterprise is custom priced through Superhuman Go."
  id: "Gratis itu $0 dengan 100 prompt AI per bulan. Pro $12 per anggota per bulan bila ditagih tahunan ($144 per tahun), $20 per bulan bila kuartalan, atau $30 per bulan bila bulanan. Enterprise harganya menyesuaikan lewat Superhuman Go."
